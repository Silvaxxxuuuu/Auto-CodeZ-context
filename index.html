<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto CodeZ</title>
    <link rel="stylesheet" href="/src/plugin-icons.css" />
    <link rel="stylesheet" href="/src/chat-execution-ui.css" />
    <link rel="stylesheet" href="/src/ui-overrides.css" />
    <link rel="stylesheet" href="/src/ui-polish.css" />
    <link rel="stylesheet" href="/src/ui-final-polish.css" />
    <link rel="stylesheet" href="/src/ui-v2-polish.css" />
    <link rel="stylesheet" href="/src/ui-execution-visibility.css" />
    <link rel="stylesheet" href="/src/profile-ui.css" />
    <link rel="stylesheet" href="/src/settings-ui.css" />
    <link rel="stylesheet" href="/src/stop-button.css" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module">
      (async () => {
        const { bootstrap } = await import('/src/ui-bootstrap.ts');
        await bootstrap();
        await import('/src/diff-ui.ts');
        await import('/src/git-ui.ts');
        await import('/src/git-actions-ui.ts');
      })().catch((error) => {
        console.error('Falha ao inicializar a interface do Auto CodeZ.', error);
        const app = document.querySelector('#app');
        if (app) {
          const message = error instanceof Error ? error.message : String(error);
          app.innerHTML = `<div style="height:100%;display:grid;place-items:center;padding:32px;background:#080a0e;color:#edf0f5;font-family:system-ui,sans-serif"><div><strong>Falha ao iniciar a interface.</strong><p style="color:#9aa3af">${message}</p></div></div>`;
        }
      });
    </script>
  </body>
</html>
