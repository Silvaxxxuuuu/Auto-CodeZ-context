<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto CodeZ</title>
    <link rel="stylesheet" href="/src/plugin-icons.css" />
    <link rel="stylesheet" href="/src/chat-execution-ui.css" />
    <link rel="stylesheet" href="/src/ui-overrides.css" />
    <link rel="stylesheet" href="/src/ui-polish.css" />
    <link rel="stylesheet" href="/src/ui-final-polish.css" />
    <link rel="stylesheet" href="/src/ui-v2-polish.css" />
    <link rel="stylesheet" href="/src/ui-execution-visibility.css" />
    <link rel="stylesheet" href="/src/profile-ui.css" />
    <link rel="stylesheet" href="/src/settings-ui.css" />
    <link rel="stylesheet" href="/src/stop-button.css" />
  </head>

  <body>
    <div id="auto-codez-static-diagnostic" style="position:fixed;left:16px;top:40px;z-index:2147483647;padding:10px 12px;background:#3b1010;color:#ffd6d6;border:1px solid #9c4040;border-radius:8px;font:12px/1.4 Consolas,monospace">JS EXECUTED · importing renderer</div>
    <div id="app"></div>
    <script>
      (() => {
        const marker = document.getElementById('auto-codez-static-diagnostic');
        const app = document.getElementById('app');
        const stringify = (value) => {
          if (value instanceof Error) return value.stack || value.message;
          if (typeof value === 'string') return value;
          try { return JSON.stringify(value); } catch { return String(value); }
        };
        const show = (title, detail = '') => {
          if (marker) marker.textContent = title;
          if (app && app.childElementCount === 0 && detail) {
            app.innerHTML = `<pre style="box-sizing:border-box;margin:0;min-height:100vh;padding:72px 24px 24px;background:#0b0d11;color:#ffb4b4;font:13px/1.55 Consolas,monospace;white-space:pre-wrap;overflow:auto">${detail}</pre>`;
          }
        };

        import('/src/renderer.ts').then(() => {
          show('DYNAMIC IMPORT OK · renderer executou');
          window.setTimeout(() => {
            if (document.querySelector('.app-shell')) {
              if (marker) marker.remove();
            } else {
              show('IMPORT OK · mas .app-shell não existe', 'O módulo /src/renderer.ts resolveu com sucesso, mas não criou .app-shell.');
            }
          }, 250);
        }).catch((error) => {
          show('DYNAMIC IMPORT FAILED', `Falha ao importar /src/renderer.ts\n\n${stringify(error)}\n\nlocation: ${location.href}\nautoCodez bridge: ${typeof window.autoCodez}`);
        });

        window.setTimeout(() => {
          if (marker && marker.textContent === 'JS EXECUTED · importing renderer') {
            show('DYNAMIC IMPORT PENDING > 5s', `A importação de /src/renderer.ts não resolveu nem rejeitou em 5 segundos.\n\nlocation: ${location.href}\nautoCodez bridge: ${typeof window.autoCodez}`);
          }
        }, 5000);
      })();
    </script>
  </body>
</html>
