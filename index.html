<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto CodeZ</title>
    <link rel="stylesheet" href="/src/plugin-icons.css" />
    <link rel="stylesheet" href="/src/chat-execution-ui.css" />
    <link rel="stylesheet" href="/src/ui-overrides.css" />
    <link rel="stylesheet" href="/src/ui-polish.css" />
    <link rel="stylesheet" href="/src/ui-final-polish.css" />
    <link rel="stylesheet" href="/src/ui-v2-polish.css" />
    <link rel="stylesheet" href="/src/ui-execution-visibility.css" />
    <link rel="stylesheet" href="/src/profile-ui.css" />
    <link rel="stylesheet" href="/src/settings-ui.css" />
    <link rel="stylesheet" href="/src/stop-button.css" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/renderer.ts"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        void Promise.all([
          import('/src/settings-ui.ts'),
          import('/src/stop-control.ts'),
          import('/src/composer-resilience.ts'),
          import('/src/thinking-ui.ts'),
          import('/src/chat-execution-ui.ts'),
          import('/src/approval-ui.ts'),
          import('/src/terminal-ui.ts'),
          import('/src/activity-ui.ts'),
          import('/src/chat-rename-ui.ts'),
          import('/src/api-settings-routing-ui.ts'),
          import('/src/initial-chat-ui.ts'),
          import('/src/profile-ui.ts'),
          import('/src/chat-api-key-settings-ui.ts'),
          import('/src/api-key-ui.ts'),
          import('/src/ui-polish.ts'),
          import('/src/error-recovery-ui.ts'),
          import('/src/api-key-flow-polish.ts'),
          import('/src/execution-visibility.ts'),
          import('/src/diff-ui.ts'),
          import('/src/git-ui.ts'),
          import('/src/git-actions-ui.ts'),
        ]).catch((error) => {
          console.error('Falha ao inicializar módulos auxiliares da interface do Auto CodeZ.', error);
        });
      }, { once: true });
    </script>
  </body>
</html>
