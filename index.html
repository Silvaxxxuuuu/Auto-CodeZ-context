    <div class="ac-startup" id="auto-codez-startup" aria-label="Carregando Auto CodeZ" role="status">

            <line data-splash-segment x1="44" y1="40" x2="28" y2="55"></line>

      </div>
    </div>
    <div id="app"></div>
