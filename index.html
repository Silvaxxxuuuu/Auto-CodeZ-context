<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto CodeZ</title>
    <link rel="stylesheet" href="/src/plugin-icons.css" />
    <link rel="stylesheet" href="/src/chat-execution-ui.css" />
    <link rel="stylesheet" href="/src/ui-overrides.css" />
    <link rel="stylesheet" href="/src/ui-polish.css" />
    <link rel="stylesheet" href="/src/ui-final-polish.css" />
    <link rel="stylesheet" href="/src/ui-v2-polish.css" />
    <link rel="stylesheet" href="/src/ui-execution-visibility.css" />
    <link rel="stylesheet" href="/src/profile-ui.css" />
    <link rel="stylesheet" href="/src/settings-ui.css" />
    <link rel="stylesheet" href="/src/stop-button.css" />
  </head>

  <body>
    <div id="app"></div>
    <script>
      (() => {
        const load = (path) => import(path).then(
          () => ({ path, ok: true }),
          (error) => ({ path, ok: false, error }),
        );

        const showFailures = (failures) => {
          if (!failures.length) return;
          const marker = document.createElement('div');
          marker.id = 'auto-codez-module-failures';
          marker.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:2147483647;max-width:520px;padding:10px 12px;background:#351414;color:#ffd4d4;border:1px solid #8d3f3f;border-radius:8px;font:12px/1.45 Consolas,monospace;white-space:pre-wrap;box-shadow:0 8px 28px #0008';
          marker.textContent = `Falha em ${failures.length} módulo(s):\n${failures.map((item) => item.path).join('\n')}`;
          document.body.appendChild(marker);
          for (const failure of failures) console.error(`Falha ao inicializar ${failure.path}.`, failure.error);
        };

        load('/src/stream-performance.ts')
          .then((streamResult) => {
            if (!streamResult.ok) console.error('Falha ao inicializar /src/stream-performance.ts.', streamResult.error);
            return load('/src/renderer.ts');
          })
          .then((rendererResult) => {
            if (!rendererResult.ok) {
              const app = document.getElementById('app');
              if (app) {
                app.innerHTML = '<pre style="box-sizing:border-box;margin:0;min-height:100vh;padding:24px;background:#0b0d11;color:#ffb4b4;font:13px/1.55 Consolas,monospace;white-space:pre-wrap">Falha ao carregar /src/renderer.ts.</pre>';
              }
              console.error('Falha ao inicializar /src/renderer.ts.', rendererResult.error);
              return;
            }

            const modules = [
              '/src/ui-polish.ts',
              '/src/settings-ui.ts',
              '/src/stop-control.ts',
              '/src/composer-resilience.ts',
              '/src/thinking-ui.ts',
              '/src/chat-execution-ui.ts',
              '/src/approval-ui.ts',
              '/src/terminal-ui.ts',
              '/src/activity-ui.ts',
              '/src/diff-ui.ts',
              '/src/git-ui.ts',
              '/src/git-actions-ui.ts',
              '/src/chat-rename-ui.ts',
              '/src/api-settings-routing-ui.ts',
              '/src/initial-chat-ui.ts',
              '/src/profile-ui.ts',
              '/src/chat-api-key-settings-ui.ts',
              '/src/api-key-ui.ts',
              '/src/error-recovery-ui.ts',
              '/src/api-key-flow-polish.ts',
              '/src/execution-visibility.ts',
            ];

            return Promise.all(modules.map(load)).then((results) => {
              showFailures(results.filter((result) => !result.ok));
            });
          })
          .catch((error) => {
            console.error('Falha inesperada no carregamento da interface.', error);
          });
      })();
    </script>
  </body>
</html>
