name: Validate Auto CodeZ

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-shot structural integration
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/ui-hierarchy-polish'
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(text, old, new, path):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one target in {path}, found {count}: {old[:120]}')
              return text.replace(old, new, 1)

          tool_path = Path('src/agent/tool-runtime.ts')
          tool = tool_path.read_text(encoding='utf-8')
          tool = replace_once(tool,
              "import { applyIncrementalEdit, type IncrementalEditToolName } from './incremental-file-edit';",
              "import { applyIncrementalEdit, type IncrementalEditToolName } from './incremental-file-edit';\nimport { StructuralEditRuntime, type StructuralSymbolKind } from './structural-edit-runtime';\nimport { TypeScriptStructuralLocator } from './typescript-structural-locator';",
              str(tool_path))
          tool = replace_once(tool,
              "  { name: 'replace_text', description: 'Replace one exact unique text fragment in an existing UTF-8 file. The oldText fragment must occur exactly once; otherwise the operation fails instead of guessing. Prefer this when you have just read the exact code to change.', parameters: { type: 'object', properties: { path: { type: 'string', description: 'Workspace-relative file path.' }, oldText: { type: 'string', description: 'Exact current text fragment. It must be unique in the file.' }, newText: { type: 'string', description: 'Replacement text, which may be empty to remove the fragment.' } }, required: ['path', 'oldText', 'newText'], additionalProperties: false }, requiresWriteAccess: true, requiresApproval: true },",
              "  { name: 'replace_text', description: 'Replace one exact unique text fragment in an existing UTF-8 file. The oldText fragment must occur exactly once; otherwise the operation fails instead of guessing. Prefer this when you have just read the exact code to change.', parameters: { type: 'object', properties: { path: { type: 'string', description: 'Workspace-relative file path.' }, oldText: { type: 'string', description: 'Exact current text fragment. It must be unique in the file.' }, newText: { type: 'string', description: 'Replacement text, which may be empty to remove the fragment.' } }, required: ['path', 'oldText', 'newText'], additionalProperties: false }, requiresWriteAccess: true, requiresApproval: true },\n  { name: 'replace_symbol', description: 'Replace one uniquely named TypeScript or JavaScript syntax symbol using the real TypeScript AST. Supported kinds are function, method, class, interface, type and enum. Use this when replacing an entire named declaration; ambiguity or unsupported files fail instead of guessing.', parameters: { type: 'object', properties: { path: { type: 'string', description: 'Workspace-relative TypeScript or JavaScript file path.' }, symbol: { type: 'string', description: 'Exact declared symbol name.' }, kind: { type: 'string', enum: ['function', 'method', 'class', 'interface', 'type', 'enum'], description: 'Declared syntax kind.' }, content: { type: 'string', description: 'Complete replacement declaration for the selected symbol.' } }, required: ['path', 'symbol', 'kind', 'content'], additionalProperties: false }, requiresWriteAccess: true, requiresApproval: true },",
              str(tool_path))
          tool = replace_once(tool,
              "    case 'replace_text': return value('path') ? `Substituindo trecho exato de ${value('path')}` : 'Substituindo trecho exato do arquivo.';",
              "    case 'replace_text': return value('path') ? `Substituindo trecho exato de ${value('path')}` : 'Substituindo trecho exato do arquivo.';\n    case 'replace_symbol': return value('path') && value('symbol') ? `Substituindo símbolo ${value('symbol')} em ${value('path')}` : 'Substituindo símbolo do arquivo.';",
              str(tool_path))
          tool = replace_once(tool,
              "  constructor(private readonly workspace: WorkspaceRuntime, private readonly permissions = new PermissionRuntime(), private readonly activity = new ActivityRuntime(), private readonly approvals = new ApprovalRuntime(), private readonly commands: CommandRuntime = unavailableCommandRuntime, private readonly diffs = new DiffRuntime(), private readonly journalStorage?: ToolJournalStorage) {}",
              "  constructor(private readonly workspace: WorkspaceRuntime, private readonly permissions = new PermissionRuntime(), private readonly activity = new ActivityRuntime(), private readonly approvals = new ApprovalRuntime(), private readonly commands: CommandRuntime = unavailableCommandRuntime, private readonly diffs = new DiffRuntime(), private readonly journalStorage?: ToolJournalStorage, private readonly structuralEdits = new StructuralEditRuntime([new TypeScriptStructuralLocator()])) {}",
              str(tool_path))
          tool = replace_once(tool,
              "normalizedCall.name === 'replace_range' || normalizedCall.name === 'replace_text' || normalizedCall.name === 'insert_before'",
              "normalizedCall.name === 'replace_range' || normalizedCall.name === 'replace_text' || normalizedCall.name === 'replace_symbol' || normalizedCall.name === 'insert_before'",
              str(tool_path))
          tool = replace_once(tool,
              "private isMutation(name: ToolName): boolean { return name === 'write_file' || name === 'create_file' || name === 'replace_range' || name === 'replace_text' || name === 'insert_before'",
              "private isMutation(name: ToolName): boolean { return name === 'write_file' || name === 'create_file' || name === 'replace_range' || name === 'replace_text' || name === 'replace_symbol' || name === 'insert_before'",
              str(tool_path))
          preview_anchor = """      case 'replace_range':
      case 'replace_text':
      case 'insert_before':
      case 'insert_after': {
        const path = this.stringValue(call.input, 'path');
        if (!(await this.workspace.exists(projectId, path))) throw new Error('O arquivo não existe.');
        const before = await this.workspace.readFile(projectId, path);
        const after = applyIncrementalEdit(call.name as IncrementalEditToolName, call.input, before);
        if (after === before) throw new Error('A edição incremental não produziria nenhuma alteração.');
        return this.diffs.createPlan([this.diffs.create(path, 'modified', before, after)]);
      }
"""
          preview_new = preview_anchor + """      case 'replace_symbol': {
        const path = this.stringValue(call.input, 'path');
        if (!(await this.workspace.exists(projectId, path))) throw new Error('O arquivo não existe.');
        const before = await this.workspace.readFile(projectId, path);
        const symbol = this.stringValue(call.input, 'symbol');
        const kind = this.stringValue(call.input, 'kind') as StructuralSymbolKind;
        const content = call.input.content;
        if (typeof content !== 'string') throw new Error(\"Parâmetro 'content' inválido.\");
        const result = await this.structuralEdits.replaceSymbol(path, before, { name: symbol, kind }, content);
        return this.diffs.createPlan([this.diffs.create(path, 'modified', before, result.after)]);
      }
"""
          tool = replace_once(tool, preview_anchor, preview_new, str(tool_path))
          execution_anchor = """      case 'replace_range':
      case 'replace_text':
      case 'insert_before':
      case 'insert_after': { const path = this.stringValue(input, 'path'); if (!(await this.workspace.exists(projectId, path))) throw new Error('O arquivo não existe.'); const before = await this.workspace.readFile(projectId, path); const after = applyIncrementalEdit(name as IncrementalEditToolName, input, before); if (after === before) throw new Error('A edição incremental não produziria nenhuma alteração.'); await this.workspace.writeFile(projectId, path, after); const persisted = await this.workspace.readFile(projectId, path); return { output: 'Trecho do arquivo atualizado.', changes: [this.diffs.create(path, 'modified', before, persisted)] }; }
"""
          execution_new = execution_anchor + """      case 'replace_symbol': { const path = this.stringValue(input, 'path'); if (!(await this.workspace.exists(projectId, path))) throw new Error('O arquivo não existe.'); const before = await this.workspace.readFile(projectId, path); const symbol = this.stringValue(input, 'symbol'); const kind = this.stringValue(input, 'kind') as StructuralSymbolKind; const content = input.content; if (typeof content !== 'string') throw new Error(\"Parâmetro 'content' inválido.\"); const result = await this.structuralEdits.replaceSymbol(path, before, { name: symbol, kind }, content); await this.workspace.writeFile(projectId, path, result.after); const persisted = await this.workspace.readFile(projectId, path); return { output: 'Símbolo atualizado.', changes: [this.diffs.create(path, 'modified', before, persisted)] }; }
"""
          tool = replace_once(tool, execution_anchor, execution_new, str(tool_path))
          tool_path.write_text(tool, encoding='utf-8', newline='')

          chat_path = Path('src/ai/chat-runtime.ts')
          chat = chat_path.read_text(encoding='utf-8')
          chat = replace_once(chat,
              "File tools such as read_file, write_file, create_file, replace_range, replace_text, insert_before, insert_after, delete_file, rename_file, and search_files",
              "File tools such as read_file, write_file, create_file, replace_range, replace_text, replace_symbol, insert_before, insert_after, delete_file, rename_file, and search_files",
              str(chat_path))
          chat = replace_once(chat,
              "For localized edits, prefer replace_text when you have an exact unique fragment from a recent read; otherwise use replace_range, insert_before or insert_after instead of rewriting the whole file with write_file.",
              "For a complete named TypeScript or JavaScript declaration, prefer replace_symbol when its supported syntax kind is known. For smaller localized edits, prefer replace_text when you have an exact unique fragment from a recent read; otherwise use replace_range, insert_before or insert_after instead of rewriting the whole file with write_file.",
              str(chat_path))
          chat = replace_once(chat,
              "prefer create_file/write_file/replace_range/replace_text/insert_before/insert_after/delete_file/rename_file over run_command",
              "prefer create_file/write_file/replace_range/replace_text/replace_symbol/insert_before/insert_after/delete_file/rename_file over run_command",
              str(chat_path))
          chat = replace_once(chat,
              "const SYSTEM_CHAT_TOOL_NAMES = new Set(['read_file', 'write_file', 'create_file', 'replace_range', 'replace_text', 'insert_before'",
              "const SYSTEM_CHAT_TOOL_NAMES = new Set(['read_file', 'write_file', 'create_file', 'replace_range', 'replace_text', 'replace_symbol', 'insert_before'",
              str(chat_path))
          chat_path.write_text(chat, encoding='utf-8', newline='')

          validate_path = Path('.github/workflows/validate.yml')
          validate_path.write_text("""name: Validate Auto CodeZ

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Core tests
        run: npm test

      - name: ESLint validation
        run: npm run lint

      - name: Electron Forge package build
        run: npm run package

      - name: Electron startup smoke test
        shell: pwsh
        env:
          AUTO_CODEZ_SMOKE: '1'
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'auto-codez-smoke.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'auto-codez-smoke.stderr.log'
          $process = Start-Process -FilePath 'npm.cmd' -ArgumentList 'start' -PassThru -WorkingDirectory $PWD -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            Write-Host '--- Electron smoke stdout ---'
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host '--- Electron smoke stderr ---'
            if (Test-Path $stderr) { Get-Content $stderr }
            if ($process.ExitCode -ne 0) {
              throw \"Electron smoke test exited with code $($process.ExitCode).\"
            }
            throw 'Electron smoke test exited before the startup window could be verified.'
          }
          Stop-Process -Id $process.Id -Force

# Validation intentionally runs the full quality gate in order.
""", encoding='utf-8', newline='')

          temporary = Path('.github/workflows/structural-tool-integration-patch.yml')
          if temporary.exists(): temporary.unlink()
          '@ | Set-Content -Encoding utf8 .patch_structural_tool.py
          python .patch_structural_tool.py
          Remove-Item .patch_structural_tool.py
          git diff --check
          git config user.name "ggmacro"
          git config user.email "sebastiao54e@gmail.com"
          git add src/agent/tool-runtime.ts src/ai/chat-runtime.ts .github/workflows/validate.yml .github/workflows/structural-tool-integration-patch.yml
          git commit -m "feat(agent): wire AST-backed symbol replacement"
          git push origin HEAD:feature/ui-hierarchy-polish

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Core tests
        run: npm test

      - name: ESLint validation
        run: npm run lint

      - name: Electron Forge package build
        run: npm run package

      - name: Electron startup smoke test
        shell: pwsh
        env:
          AUTO_CODEZ_SMOKE: '1'
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'auto-codez-smoke.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'auto-codez-smoke.stderr.log'
          $process = Start-Process -FilePath 'npm.cmd' -ArgumentList 'start' -PassThru -WorkingDirectory $PWD -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            Write-Host '--- Electron smoke stdout ---'
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host '--- Electron smoke stderr ---'
            if (Test-Path $stderr) { Get-Content $stderr }
            if ($process.ExitCode -ne 0) {
              throw "Electron smoke test exited with code $($process.ExitCode)."
            }
            throw 'Electron smoke test exited before the startup window could be verified.'
          }
          Stop-Process -Id $process.Id -Force

