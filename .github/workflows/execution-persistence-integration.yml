name: Integrate execution persistence

on:
  push:
    branches:
      - feature/ui-hierarchy-polish
    paths:
      - .github/workflows/execution-persistence-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Patch canonical execution persistence
        shell: pwsh
        run: |
          $encoded = ''
          [IO.File]::WriteAllBytes('.patch_execution_persistence.py', [Convert]::FromBase64String($encoded))
          python .patch_execution_persistence.py
          Remove-Item .patch_execution_persistence.py
          git diff --check
          npm run typecheck
          npm test
      - name: Commit integration and remove workflow
        shell: pwsh
        run: |
          git config user.name "ggmacro"
          git config user.email "sebastiao54e@gmail.com"
          git add src/main.ts
          git rm .github/workflows/execution-persistence-integration.yml
          git commit -m "feat(execution): persist canonical execution snapshots"
          git push origin HEAD:feature/ui-hierarchy-polish
