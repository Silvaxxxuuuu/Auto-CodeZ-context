name: Wire execution authority IPC

on:
  push:
    branches:
      - feature/ui-hierarchy-polish
    paths:
      - .github/workflows/execution-ipc-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish
          fetch-depth: 0
      - name: Patch main and preload
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_exact(path_name, old, new):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')

          replace_exact('src/main.ts', "import { ExecutionManager } from './execution-manager';", "import { ExecutionManager, type ExecutionChange } from './execution-manager';")
          replace_exact('src/main.ts', "function sendStreamEvent(event: AIStreamEvent): void {\n  if (mainWindow && !mainWindow.isDestroyed()) mainWindow.webContents.send('chat:stream-event', event);\n}\n", "function sendStreamEvent(event: AIStreamEvent): void {\n  if (mainWindow && !mainWindow.isDestroyed()) mainWindow.webContents.send('chat:stream-event', event);\n}\n\nfunction sendExecutionChange(change: ExecutionChange): void {\n  if (mainWindow && !mainWindow.isDestroyed()) mainWindow.webContents.send('execution:event', change);\n}\n\nexecutionManager.subscribe(sendExecutionChange);\n")
          replace_exact('src/preload.ts', "  listExecutions: (chatId?: string) => invoke('agent:list-executions', chatId === undefined ? undefined : requireIdentifier(chatId, 'Chat')),\n", "  listExecutions: (chatId?: string) => invoke('agent:list-executions', chatId === undefined ? undefined : requireIdentifier(chatId, 'Chat')),\n  onExecutionEvent: (listener: (event: unknown) => void) => {\n    const handler = (_event: Electron.IpcRendererEvent, payload: unknown) => listener(payload);\n    ipcRenderer.on('execution:event', handler);\n    return () => ipcRenderer.removeListener('execution:event', handler);\n  },\n")
          '@ | Set-Content -Encoding utf8 .patch_execution_ipc.py
          python .patch_execution_ipc.py
          Remove-Item .patch_execution_ipc.py
          git diff --check
          git diff -- src/main.ts src/preload.ts
      - name: Commit IPC bridge
        shell: pwsh
        run: |
          git config user.name "ggmacro"
          git config user.email "sebastiao54e@gmail.com"
          git add src/main.ts src/preload.ts
          git commit -m "feat(execution): bridge authoritative snapshots to renderer"
          git push origin HEAD:feature/ui-hierarchy-polish
