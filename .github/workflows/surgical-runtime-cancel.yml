name: Surgical runtime cancellation

on:
  push:
    branches: [feature/ui-hierarchy-polish]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact runtime cancellation patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('src/ai/providers/openai.ts',
              "async send(config: AIProviderConfig, request: AIRequest): Promise<AIResponse> {\n    const response = await fetchWithTimeout(",
              "async send(config: AIProviderConfig, request: AIRequest, signal?: AbortSignal): Promise<AIResponse> {\n    const response = await fetchWithTimeout(")
          replace('src/ai/providers/openai.ts',
              "body: JSON.stringify(this.buildBody(request)),\n    }, REQUEST_TIMEOUT_MS);",
              "body: JSON.stringify(this.buildBody(request)),\n      signal,\n    }, REQUEST_TIMEOUT_MS);")
          replace('src/ai/providers/openai.ts',
              "async *stream(config: AIProviderConfig, request: AIRequest): AsyncGenerator<AIStreamEvent> {\n    const response = await fetchWithTimeout(",
              "async *stream(config: AIProviderConfig, request: AIRequest, signal?: AbortSignal): AsyncGenerator<AIStreamEvent> {\n    const response = await fetchWithTimeout(")
          replace('src/ai/providers/openai.ts',
              "body: JSON.stringify(this.buildBody(request, true)),\n    }, REQUEST_TIMEOUT_MS);",
              "body: JSON.stringify(this.buildBody(request, true)),\n      signal,\n    }, REQUEST_TIMEOUT_MS);")

          replace('src/ai/providers/google.ts',
              "async send(config: AIProviderConfig, request: AIRequest): Promise<AIResponse> {",
              "async send(config: AIProviderConfig, request: AIRequest, signal?: AbortSignal): Promise<AIResponse> {")
          replace('src/ai/providers/google.ts',
              "async *stream(config: AIProviderConfig, request: AIRequest): AsyncGenerator<AIStreamEvent> {",
              "async *stream(config: AIProviderConfig, request: AIRequest, signal?: AbortSignal): AsyncGenerator<AIStreamEvent> {")
          replace('src/ai/providers/google.ts',
              "const response = await fetchWithTimeout(url, {\n      method: 'POST',",
              "const response = await fetchWithTimeout(url, {\n      method: 'POST',")
          replace('src/ai/providers/google.ts',
              "body: JSON.stringify(body),\n    }, REQUEST_TIMEOUT_MS);",
              "body: JSON.stringify(body),\n      signal,\n    }, REQUEST_TIMEOUT_MS);")

          replace('src/ai/providers/anthropic.ts',
              "async send(config: AIProviderConfig, request: AIRequest): Promise<AIResponse> {",
              "async send(config: AIProviderConfig, request: AIRequest, signal?: AbortSignal): Promise<AIResponse> {")
          replace('src/ai/providers/anthropic.ts',
              "async *stream(config: AIProviderConfig, request: AIRequest): AsyncGenerator<AIStreamEvent> {",
              "async *stream(config: AIProviderConfig, request: AIRequest, signal?: AbortSignal): AsyncGenerator<AIStreamEvent> {")
          replace('src/ai/providers/anthropic.ts',
              "body: JSON.stringify(body),\n    }, REQUEST_TIMEOUT_MS);",
              "body: JSON.stringify(body),\n      signal,\n    }, REQUEST_TIMEOUT_MS);")

          replace('src/ai/chat-runtime.ts',
              "async send(config: AIProviderConfig, chat: ChatRecord, projectContext?: string): Promise<AIResponse> {",
              "async send(config: AIProviderConfig, chat: ChatRecord, projectContext?: string, signal?: AbortSignal): Promise<AIResponse> {")
          replace('src/ai/chat-runtime.ts',
              "const response = await adapter.send(config, request);",
              "const response = await adapter.send(config, request, signal);")
          replace('src/ai/chat-runtime.ts',
              "async *stream(config: AIProviderConfig, chat: ChatRecord, projectContext?: string): AsyncGenerator<AIStreamEvent> {",
              "async *stream(config: AIProviderConfig, chat: ChatRecord, projectContext?: string, signal?: AbortSignal): AsyncGenerator<AIStreamEvent> {")
          replace('src/ai/chat-runtime.ts',
              "for await (const event of adapter.stream(config, request)) {",
              "for await (const event of adapter.stream(config, request, signal)) {")
          replace('src/ai/chat-runtime.ts',
              "const response = await adapter.send(config, request);",
              "const response = await adapter.send(config, request, signal);")

          replace('src/agent/agent-runtime.ts',
              "async *runStreaming(",
              "async *runStreaming(")
          p = Path('src/agent/agent-runtime.ts')
          text = p.read_text(encoding='utf-8')
          marker = "): AsyncGenerator<AIStreamEvent> {"
          if marker not in text:
              raise SystemExit('AgentRuntime runStreaming signature marker not found')
          text = text.replace(marker, ", signal?: AbortSignal): AsyncGenerator<AIStreamEvent> {", 1)
          text = text.replace("this.chatRuntime.stream(config, chat, projectContext)", "this.chatRuntime.stream(config, chat, projectContext, signal)", 1)
          text = text.replace("const pendingApprovalIds =", "signal?.throwIfAborted();\n      const pendingApprovalIds =", 1)
          p.write_text(text, encoding='utf-8')

          replace('src/preload.ts',
              "streamChat: (input: { chatId: string; content: string }) => ipcRenderer.invoke('chat:stream', input),",
              "streamChat: (input: { chatId: string; content: string }) => ipcRenderer.invoke('chat:stream', input),\n      stopChat: (input: { chatId: string }) => ipcRenderer.invoke('chat:stop', input),")

          replace('src/main.ts',
              "const executionManager = new ExecutionManager();",
              "const executionManager = new ExecutionManager();\nconst activeChatControllers = new Map<string, AbortController>();")
          replace('src/main.ts',
              "ipcMain.handle('chat:stream', async (_event, input: { chatId: string; content: string }) => {",
              "ipcMain.handle('chat:stop', async (_event, input: { chatId: string }) => {\n  const controller = activeChatControllers.get(input.chatId);\n  if (!controller) return { stopped: false };\n  controller.abort();\n  return { stopped: true };\n});\n\nipcMain.handle('chat:stream', async (_event, input: { chatId: string; content: string }) => {")
          replace('src/main.ts',
              "const run = await executionManager.start(input.chatId);",
              "const run = await executionManager.start(input.chatId);\n    const controller = new AbortController();\n    activeChatControllers.set(input.chatId, controller);")
          replace('src/main.ts',
              "for await (const event of agentRuntime.runStreaming(",
              "for await (const event of agentRuntime.runStreaming(")
          replace('src/main.ts',
              ")) {\n        mainWindow?.webContents.send('chat:stream-event', { ...event, chatId: input.chatId, runId: run.runId });",
              ", controller.signal)) {\n        mainWindow?.webContents.send('chat:stream-event', { ...event, chatId: input.chatId, runId: run.runId });")
          replace('src/main.ts',
              "} catch (error) {\n      const message = error instanceof Error ? error.message : 'Falha ao executar o chat.';",
              "} catch (error) {\n      if (controller.signal.aborted) {\n        mainWindow?.webContents.send('chat:stream-event', { type: 'cancelled', chatId: input.chatId, runId: run.runId });\n        await executionManager.complete(input.chatId).catch(() => undefined);\n        return { pendingApprovalIds: [], chat: await chatRuntime.getChat(input.chatId) };\n      }\n      const message = error instanceof Error ? error.message : 'Falha ao executar o chat.';")
          replace('src/main.ts',
              "    } finally {\n      await executionManager.persist();",
              "    } finally {\n      if (activeChatControllers.get(input.chatId) === controller) activeChatControllers.delete(input.chatId);\n      await executionManager.persist();")

          replace('src/renderer.ts',
              "type StreamEvent = { type: 'start' | 'delta' | 'activity' | 'tool_call' | 'usage' | 'complete' | 'approval_required' | 'error';",
              "type StreamEvent = { type: 'start' | 'delta' | 'activity' | 'tool_call' | 'usage' | 'complete' | 'approval_required' | 'cancelled' | 'error';")
          replace('src/renderer.ts',
              "streamChat: (input: { chatId: string; content: string }) => Promise<{ pendingApprovalIds: string[]; chat: Chat }>;",
              "streamChat: (input: { chatId: string; content: string }) => Promise<{ pendingApprovalIds: string[]; chat: Chat }>;\n      stopChat: (input: { chatId: string }) => Promise<{ stopped: boolean }>;" )
          replace('src/renderer.ts',
              "sendButton.disabled = !activeChat || !prompt.value.trim() || busy || pendingApprovals.length > 0;\n  prompt.disabled = busy;",
              "sendButton.disabled = !activeChat || (executionState !== 'running' && !prompt.value.trim()) || (executionState !== 'running' && (busy || pendingApprovals.length > 0));\n  sendButton.classList.toggle('stop-mode', executionState === 'running');\n  sendButton.title = executionState === 'running' ? 'Parar' : 'Enviar';\n  sendButton.setAttribute('aria-label', executionState === 'running' ? 'Parar' : 'Enviar');\n  prompt.disabled = busy;")
          replace('src/renderer.ts',
              "sendButton.addEventListener('click', () => void sendMessage());",
              "async function stopMessage(): Promise<void> {\n  if (!activeChat || executionState !== 'running') return;\n  const chatId = activeChat.id;\n  executionState = 'idle';\n  streamingText = '';\n  streamingActivity = [];\n  pendingApprovals = [];\n  retryContent = '';\n  lastSubmittedContent = '';\n  renderMessages();\n  renderComposer();\n  await window.autoCodez.stopChat({ chatId }).catch(() => undefined);\n}\n\nsendButton.addEventListener('click', () => void (executionState === 'running' ? stopMessage() : sendMessage()));")
          replace('src/renderer.ts',
              "if (event.type === 'complete') {",
              "if (event.type === 'cancelled') {\n    if (activeChat && event.chatId === activeChat.id) {\n      executionState = 'idle';\n      streamingText = '';\n      streamingActivity = [];\n      pendingApprovals = [];\n      retryContent = '';\n      lastSubmittedContent = '';\n      renderMessages();\n      renderComposer();\n    }\n    return;\n  }\n  if (event.type === 'complete') {")

          Path('src/stop-button.css').write_text(".send-button.stop-mode::before { content: ''; display: block; width: 10px; height: 10px; border-radius: 2px; background: currentColor; }\n", encoding='utf-8')
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          if '/src/stop-button.css' not in text:
              text = text.replace('<link rel="stylesheet" href="/src/ui-execution-visibility.css" />', '<link rel="stylesheet" href="/src/ui-execution-visibility.css" />\n<link rel="stylesheet" href="/src/stop-button.css" />')
              index.write_text(text, encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --runInBand
          npm run lint
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src index.html
          git rm .github/workflows/surgical-runtime-cancel.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(runtime): add provider-neutral stop control'
          git push origin HEAD:feature/ui-hierarchy-polish
