name: Add TypeScript runtime dependency

on:
  push:
    branches:
      - feature/ui-hierarchy-polish
    paths:
      - .github/workflows/add-typescript-runtime-dependency.yml

permissions:
  contents: write

jobs:
  dependency:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Add exact TypeScript runtime dependency
        shell: pwsh
        run: |
          npm install typescript@5.9.3 --save-exact
          npm ls typescript --depth=0
          git diff --check
          git diff -- package.json package-lock.json
      - name: Commit dependency manifests
        shell: pwsh
        run: |
          git config user.name "ggmacro"
          git config user.email "sebastiao54e@gmail.com"
          git add package.json package-lock.json
          git commit -m "build(agent): add TypeScript parser runtime dependency"
          git push origin HEAD:feature/ui-hierarchy-polish
