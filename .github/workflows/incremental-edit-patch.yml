name: Apply incremental edit runtime patch

on:
  push:
    branches:
      - feature/ui-hierarchy-polish
    paths:
      - .github/workflows/incremental-edit-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish
          fetch-depth: 0
      - name: Patch tool runtime
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('src/agent/tool-runtime.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str):
              global text
              if old not in text:
                  raise SystemExit(f'Expected snippet not found:\n{old[:240]}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { SYSTEM_WORKSPACE_ID } from './system-workspace';",
              "import { SYSTEM_WORKSPACE_ID } from './system-workspace';\nimport { applyIncrementalEdit, type IncrementalEditToolName } from './incremental-file-edit';",
          )

          replace_once(
              "  { name: 'write_file', description: 'Replace the contents of an existing UTF-8 text file inside the active workspace. Prefer this tool over shell commands for workspace file edits so Auto CodeZ can preview and review the exact diff.', parameters: { type: 'object', properties: { path: { type: 'string', description: 'Workspace-relative file path.' }, content: { type: 'string', description: 'Complete replacement file contents.' } }, required: ['path', 'content'], additionalProperties: false }, requiresWriteAccess: true, requiresApproval: true },",
              "  { name: 'write_file', description: 'Replace the contents of an existing UTF-8 text file inside the active workspace. Use this only when replacing most or all of a file; prefer replace_range, insert_before or insert_after for localized edits so diffs stay small.', parameters: { type: 'object', properties: { path: { type: 'string', description: 'Workspace-relative file path.' }, content: { type: 'string', description: 'Complete replacement file contents.' } }, required: ['path', 'content'], additionalProperties: false }, requiresWriteAccess: true, requiresApproval: true },\n  { name: 'replace_range', description: 'Replace an inclusive 1-based line range in an existing UTF-8 text file. Prefer this for localized edits instead of rewriting the whole file.', parameters: { type: 'object', properties: { path: { type: 'string', description: 'Workspace-relative file path.' }, startLine: { type: 'number', description: 'First 1-based line to replace.' }, endLine: { type: 'number', description: 'Last 1-based line to replace, inclusive.' }, content: { type: 'string', description: 'Replacement line content.' } }, required: ['path', 'startLine', 'endLine', 'content'], additionalProperties: false }, requiresWriteAccess: true, requiresApproval: true },\n  { name: 'insert_before', description: 'Insert one or more lines immediately before a 1-based line in an existing UTF-8 text file.', parameters: { type: 'object', properties: { path: { type: 'string', description: 'Workspace-relative file path.' }, line: { type: 'number', description: '1-based line before which content is inserted.' }, content: { type: 'string', description: 'Line content to insert.' } }, required: ['path', 'line', 'content'], additionalProperties: false }, requiresWriteAccess: true, requiresApproval: true },\n  { name: 'insert_after', description: 'Insert one or more lines immediately after a 1-based line in an existing UTF-8 text file.', parameters: { type: 'object', properties: { path: { type: 'string', description: 'Workspace-relative file path.' }, line: { type: 'number', description: '1-based line after which content is inserted.' }, content: { type: 'string', description: 'Line content to insert.' } }, required: ['path', 'line', 'content'], additionalProperties: false }, requiresWriteAccess: true, requiresApproval: true },",
          )

          replace_once(
              "    case 'write_file': return value('path') ? `Editando ${value('path')}` : 'Editando arquivo.';",
              "    case 'write_file': return value('path') ? `Editando ${value('path')}` : 'Editando arquivo.';\n    case 'replace_range': return value('path') ? `Editando trecho de ${value('path')}` : 'Editando trecho do arquivo.';\n    case 'insert_before': return value('path') ? `Inserindo conteúdo em ${value('path')}` : 'Inserindo conteúdo no arquivo.';\n    case 'insert_after': return value('path') ? `Inserindo conteúdo em ${value('path')}` : 'Inserindo conteúdo no arquivo.';",
          )

          replace_once(
              "    const systemFileTool = normalizedCall.name === 'read_file' || normalizedCall.name === 'write_file' || normalizedCall.name === 'create_file' || normalizedCall.name === 'delete_file' || normalizedCall.name === 'rename_file' || normalizedCall.name === 'search_files';",
              "    const systemFileTool = normalizedCall.name === 'read_file' || normalizedCall.name === 'write_file' || normalizedCall.name === 'create_file' || normalizedCall.name === 'replace_range' || normalizedCall.name === 'insert_before' || normalizedCall.name === 'insert_after' || normalizedCall.name === 'delete_file' || normalizedCall.name === 'rename_file' || normalizedCall.name === 'search_files';",
          )

          replace_once(
              "      case 'create_file': {",
              "      case 'replace_range':\n      case 'insert_before':\n      case 'insert_after': {\n        const path = this.stringValue(call.input, 'path');\n        if (!(await this.workspace.exists(projectId, path))) throw new Error('O arquivo não existe.');\n        const before = await this.workspace.readFile(projectId, path);\n        const after = applyIncrementalEdit(call.name as IncrementalEditToolName, call.input, before);\n        if (after === before) throw new Error('A edição incremental não produziria nenhuma alteração.');\n        return this.diffs.createPlan([this.diffs.create(path, 'modified', before, after)]);\n      }\n      case 'create_file': {",
          )

          replace_once(
              "  private isMutation(name: ToolName): boolean { return name === 'write_file' || name === 'create_file' || name === 'delete_file' || name === 'rename_file'; }",
              "  private isMutation(name: ToolName): boolean { return name === 'write_file' || name === 'create_file' || name === 'replace_range' || name === 'insert_before' || name === 'insert_after' || name === 'delete_file' || name === 'rename_file'; }",
          )

          replace_once(
              "      case 'create_file': { const path = this.stringValue(input, 'path'); const content = String(input.content ?? ''); await this.workspace.createFile(projectId, path, content); const after = await this.workspace.readFile(projectId, path); return { output: 'Arquivo criado.', changes: [this.diffs.create(path, 'created', '', after)] }; }",
              "      case 'replace_range':\n      case 'insert_before':\n      case 'insert_after': { const path = this.stringValue(input, 'path'); if (!(await this.workspace.exists(projectId, path))) throw new Error('O arquivo não existe.'); const before = await this.workspace.readFile(projectId, path); const after = applyIncrementalEdit(name as IncrementalEditToolName, input, before); if (after === before) throw new Error('A edição incremental não produziria nenhuma alteração.'); await this.workspace.writeFile(projectId, path, after); const persisted = await this.workspace.readFile(projectId, path); return { output: 'Trecho do arquivo atualizado.', changes: [this.diffs.create(path, 'modified', before, persisted)] }; }\n      case 'create_file': { const path = this.stringValue(input, 'path'); const content = String(input.content ?? ''); await this.workspace.createFile(projectId, path, content); const after = await this.workspace.readFile(projectId, path); return { output: 'Arquivo criado.', changes: [this.diffs.create(path, 'created', '', after)] }; }",
          )

          path.write_text(text, encoding='utf-8', newline='')
          '@ | Set-Content -Encoding utf8 .patch_incremental.py
          python .patch_incremental.py
          Remove-Item .patch_incremental.py
          git diff --check
          git diff -- src/agent/tool-runtime.ts
      - name: Commit runtime patch
        shell: pwsh
        run: |
          git config user.name "ggmacro"
          git config user.email "sebastiao54e@gmail.com"
          git add src/agent/tool-runtime.ts
          git commit -m "feat(agent): wire incremental file edit tools"
          git push origin HEAD:feature/ui-hierarchy-polish
