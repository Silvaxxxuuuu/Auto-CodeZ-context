name: Generate terminal dependency lockfile

on:
  push:
    branches:
      - feature/ui-hierarchy-polish
    paths:
      - '.github/workflows/generate-terminal-lock.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate package manifests
        run: npm install --save-exact node-pty@1.1.0 @xterm/xterm@6.0.0 @xterm/addon-fit@0.11.0 --package-lock-only

      - name: Commit generated manifests
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "feat(terminal): add PTY and xterm dependencies"
            git push origin HEAD:feature/ui-hierarchy-polish
          }
