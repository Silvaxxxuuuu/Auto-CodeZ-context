name: Integrate execution timeline bridge

on:
  push:
    branches:
      - feature/ui-hierarchy-polish
    paths:
      - .github/workflows/execution-timeline-bridge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch read-only execution timeline bridge
        shell: pwsh
        run: |
          $encoded = ''
          [IO.File]::WriteAllBytes('.patch_execution_timeline_bridge.py', [Convert]::FromBase64String($encoded))
          python .patch_execution_timeline_bridge.py
          Remove-Item .patch_execution_timeline_bridge.py
          git diff --check
          npm run typecheck
          npm test
      - name: Commit bridge and remove workflow
        shell: pwsh
        run: |
          git config user.name "ggmacro"
          git config user.email "sebastiao54e@gmail.com"
          git add src/main.ts src/preload.ts
          git rm .github/workflows/execution-timeline-bridge.yml
          git commit -m "feat(execution): expose read-only execution timeline"
          git push origin HEAD:feature/ui-hierarchy-polish
