name: Validate Account API

on:
  push:
    branches:
      - feature/ui-hierarchy-polish
    paths:
      - 'services/account-api/**'
      - '.github/workflows/account-api.yml'
  pull_request:
    paths:
      - 'services/account-api/**'
      - '.github/workflows/account-api.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autocodez
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autocodez"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/autocodez
      ACCOUNT_PUBLIC_URL: https://accounts.example.test
      BETTER_AUTH_SECRET: better-auth-ci-secret-000000000000000000000000
      ACCOUNT_ACCESS_TOKEN_SECRET: desktop-access-ci-secret-000000000000000000
      PASSKEY_RP_ID: accounts.example.test
      PASSKEY_RP_NAME: Auto CodeZ
      DESCOPE_PROJECT_ID: P2abcDEF_123

    defaults:
      run:
        working-directory: services/account-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Database migrations
        run: npm run migrate:build

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: Account Data migrations
        run: npm run migrate:data:build

      - name: Production build
        run: npm run build

      - name: Account Data startup smoke
        shell: bash
        run: |
          node dist/account-data-server.js > /tmp/account-data.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat /tmp/account-data.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/account-data.log
          exit 1

      - name: Production container build
        run: docker build --tag auto-codez-account-api:ci .

      - name: Account Data container build
        run: docker build --file Dockerfile.account-data --tag auto-codez-account-data:ci .
