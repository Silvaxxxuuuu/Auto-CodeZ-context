name: Surgical approval event patch

on:
  push:
    branches: [feature/ui-hierarchy-polish]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add explicit approval event
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/agent/agent-runtime.ts')
          s = p.read_text()
          marker = "this.activity.emit({ runId: run.runId, chatId: run.chat.id, type: 'action', message: 'O agente aguarda aprovação antes de continuar.', status: 'pending' });"
          if marker not in s:
              raise SystemExit('Approval activity marker not found')
          insertion = "emit({ type: 'approval_required', chatId: run.chat.id, runId: run.runId, pendingApprovalIds: [...pendingApprovalIds] }); "
          if insertion.strip() not in s:
              s = s.replace(marker, insertion + marker, 1)
          else:
              raise SystemExit('Approval event already present')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand
          npm run lint
          npm run make
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent/agent-runtime.ts
          git rm .github/workflows/surgical-approval-event.yml
          git commit -m "fix(runtime): emit approval required event immediately"
          git push origin HEAD:feature/ui-hierarchy-polish
