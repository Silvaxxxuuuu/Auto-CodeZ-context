name: Auto CodeZ stability repair
on:
  push:
    branches:
      - feature/unified-ai-platform
permissions:
  contents: write
jobs:
  repair:
    if: startsWith(github.event.head_commit.message, 'automation: repair stability')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-ai-platform
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply stability repairs
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          renderer = Path('src/renderer.ts')
          text = renderer.read_text(encoding='utf-8')

          old = """  if (event.type === 'error' && event.error) {\n    streamingActivity.push(event.error);\n    renderMessages();\n  }"""
          new = """  if (event.type === 'error' && event.error) {\n    streaming = false;\n    streamingText = '';\n    streamingActivity.push(event.error);\n    renderMessages();\n    renderComposer();\n  }"""
          if old not in text:
              raise SystemExit('renderer error handler pattern not found')
          text = text.replace(old, new, 1)

          old = """async function refresh(): Promise<void> {\n  const state = await window.autoCodez.getState();\n  providers = state.providers;\n  chats = state.chats;\n  projects = state.projects;\n  if (activeChat) activeChat = chats.find((chat) => chat.id === activeChat!.id) || activeChat;\n  if (activeChat) composerIntelligence = activeChat.intelligence;\n  renderNav();\n  renderHeader();\n  renderMessages();\n  renderComposer();\n}"""
          new = """async function refresh(): Promise<void> {\n  try {\n    const state = await window.autoCodez.getState();\n    providers = state.providers;\n    chats = state.chats;\n    projects = state.projects;\n    if (activeChat) activeChat = chats.find((chat) => chat.id === activeChat!.id) || activeChat;\n    if (activeChat) composerIntelligence = activeChat.intelligence;\n    renderNav();\n    renderHeader();\n    renderMessages();\n    renderComposer();\n  } catch (error) {\n    streaming = false;\n    streamingText = '';\n    streamingActivity = [error instanceof Error ? error.message : 'Não foi possível carregar o estado do aplicativo.'];\n    renderNav();\n    renderHeader();\n    renderMessages();\n    renderComposer();\n  }\n}"""
          if old not in text:
              raise SystemExit('renderer refresh pattern not found')
          text = text.replace(old, new, 1)

          old = """async function refreshApprovals(): Promise<void> {\n  pendingApprovals = await window.autoCodez.listApprovals();\n  renderMessages();\n  renderComposer();\n}"""
          new = """async function refreshApprovals(): Promise<void> {\n  try {\n    pendingApprovals = await window.autoCodez.listApprovals();\n    renderMessages();\n    renderComposer();\n  } catch (error) {\n    pendingApprovals = [];\n    streaming = false;\n    streamingActivity.push(error instanceof Error ? error.message : 'Não foi possível carregar as aprovações.');\n    renderMessages();\n    renderComposer();\n  }\n}"""
          if old not in text:
              raise SystemExit('renderer approvals pattern not found')
          text = text.replace(old, new, 1)

          marker = "const modalRoot = document.querySelector<HTMLDivElement>('#modal-root')!;\n"
          insertion = marker + "\nwindow.addEventListener('error', (event) => {\n  streaming = false;\n  streamingText = '';\n  streamingActivity.push(event.error instanceof Error ? event.error.message : event.message || 'Erro inesperado no renderer.');\n  renderMessages();\n  renderComposer();\n});\n\nwindow.addEventListener('unhandledrejection', (event) => {\n  streaming = false;\n  streamingText = '';\n  streamingActivity.push(event.reason instanceof Error ? event.reason.message : String(event.reason || 'Operação rejeitada.'));\n  renderMessages();\n  renderComposer();\n});\n"
          if marker not in text:
              raise SystemExit('renderer initialization marker not found')
          text = text.replace(marker, insertion, 1)

          renderer.write_text(text, encoding='utf-8', newline='\n')

          main = Path('src/main.ts')
          text = main.read_text(encoding='utf-8')
          old = "app.whenReady().then(async () => { await storage.init(); await loadProviders(); await projectManager.init(); await chatManager.init(); await createWindow(); app.on('activate', async () => { if (BrowserWindow.getAllWindows().length === 0) await createWindow(); }); });"
          new = "app.whenReady().then(async () => { await storage.init(); await loadProviders(); await projectManager.init(); await chatManager.init(); await createWindow(); app.on('activate', async () => { if (BrowserWindow.getAllWindows().length === 0) await createWindow(); }); }).catch((error) => { const message = error instanceof Error ? error.message : 'Falha ao inicializar o Auto CodeZ.'; dialog.showErrorBox('Auto CodeZ', message); app.quit(); });"
          if old not in text:
              raise SystemExit('main initialization pattern not found')
          main.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          '@ | python -
      - name: Validate
        shell: pwsh
        run: |
          npm ci
          npx tsc --noEmit
          npm run package
      - name: Commit repairs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer.ts src/main.ts
          git commit -m "fix: stabilize renderer and startup error handling"
          git push origin feature/unified-ai-platform
          git rm .github/workflows/auto-repair.yml
          git commit -m "chore: remove temporary repair workflow"
          git push origin feature/unified-ai-platform
