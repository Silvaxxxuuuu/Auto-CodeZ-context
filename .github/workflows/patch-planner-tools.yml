name: Patch planner tools

on:
  push:
    branches:
      - feature/ui-hierarchy-polish
    paths:
      - .github/workflows/patch-planner-tools.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish
          fetch-depth: 0
      - name: Patch planner tool integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          planner_path = Path('src/execution-planner.ts')
          planner = planner_path.read_text(encoding='utf-8')
          old = "  remove(chatId: string, runId?: string): boolean {\n"
          new = "  recordEvidence(chatId: string, runId: string, evidence: Omit<ExecutionStepEvidence, 'createdAt'>): ExecutionPlan {\n    const plan = this.plansByChat.get(chatId);\n    if (!plan || plan.runId !== runId) throw new Error('Plano da execução não encontrado.');\n    if (plan.status === 'completed' || plan.status === 'failed') throw new Error('O plano já está em estado terminal.');\n    const step = plan.steps.find((item) => item.status === 'running');\n    if (!step) throw new Error('Nenhum passo do plano está em execução.');\n    this.appendEvidence(step, [evidence]);\n    const updatedAt = this.now();\n    step.updatedAt = updatedAt;\n    plan.updatedAt = updatedAt;\n    this.publish({ type: 'upsert', plan });\n    return clonePlan(plan);\n  }\n\n  remove(chatId: string, runId?: string): boolean {\n"
          assert old in planner
          planner = planner.replace(old, new, 1)
          planner_path.write_text(planner, encoding='utf-8')

          tool_path = Path('src/agent/tool-runtime.ts')
          tool = tool_path.read_text(encoding='utf-8')
          old = "import { TypeScriptStructuralLocator } from './typescript-structural-locator';\n"
          new = "import { TypeScriptStructuralLocator } from './typescript-structural-locator';\nimport { ExecutionPlanner, type ExecutionPlan } from '../execution-planner';\n"
          assert old in tool
          tool = tool.replace(old, new, 1)

          old = "const definitions: AIToolDefinition[] = [\n"
          new = "const definitions: AIToolDefinition[] = [\n  { name: 'plan_execution', description: 'Declare a concrete execution plan for a multi-step task. Auto CodeZ starts the first step immediately. Use this before substantial multi-step tool work, then execute real tools and call complete_plan_step only after the current step has runtime-recorded evidence.', parameters: { type: 'object', properties: { objective: { type: 'string', description: 'Concrete objective of this execution.' }, steps: { type: 'array', items: { type: 'string' }, description: 'Ordered, concise execution steps.' } }, required: ['objective', 'steps'], additionalProperties: false }, requiresWriteAccess: false, requiresApproval: false },\n  { name: 'complete_plan_step', description: 'Complete the currently running execution-plan step. Auto CodeZ rejects this unless the current step already contains evidence produced by a real successful tool execution. When successful, the next pending step starts automatically.', parameters: { type: 'object', properties: {}, required: [], additionalProperties: false }, requiresWriteAccess: false, requiresApproval: false },\n"
          assert old in tool
          tool = tool.replace(old, new, 1)

          old = "  switch (call.name) {\n    case 'run_command':"
          new = "  switch (call.name) {\n    case 'plan_execution': return 'Criando plano de execução.';\n    case 'complete_plan_step': return 'Concluindo passo do plano.';\n    case 'run_command':"
          assert old in tool
          tool = tool.replace(old, new, 1)

          old = "  private gitRuntime?: GitRuntime;\n\n  constructor("
          new = "  private gitRuntime?: GitRuntime;\n  private executionPlanner?: ExecutionPlanner;\n\n  constructor("
          assert old in tool
          tool = tool.replace(old, new, 1)

          old = "  configureGitRuntime(runtime: GitRuntime): void { this.gitRuntime = runtime; }\n"
          new = "  configureGitRuntime(runtime: GitRuntime): void { this.gitRuntime = runtime; }\n  configureExecutionPlanner(runtime: ExecutionPlanner): void { this.executionPlanner = runtime; }\n  getExecutionPlan(chatId: string, runId: string): ExecutionPlan | undefined { return this.executionPlanner?.get(chatId, runId); }\n"
          assert old in tool
          tool = tool.replace(old, new, 1)

          old = "      const execution = await this.executeAllowed(projectId, call.name, call.input);\n      const result: AIToolResult ="
          new = "      const execution = await this.executeAllowed(projectId, call.name, call.input, context);\n      this.recordPlanEvidence(context, call, execution);\n      const result: AIToolResult ="
          assert old in tool
          tool = tool.replace(old, new, 1)

          old = "  private isMutation(name: ToolName): boolean {"
          new = "  private recordPlanEvidence(context: ActivityContext, call: AIToolCall, execution: ToolExecution): void {\n    if (!this.executionPlanner || !context.chatId || !context.runId || call.name === 'plan_execution' || call.name === 'complete_plan_step') return;\n    if (execution.commandResult && execution.commandResult.exitCode !== 0) return;\n    const plan = this.executionPlanner.get(context.chatId, context.runId);\n    if (!plan?.steps.some((step) => step.status === 'running')) return;\n    let type: 'tool' | 'test' | 'build' | 'file' = execution.changes?.length ? 'file' : 'tool';\n    let reference: string | undefined;\n    if (execution.commandResult) {\n      const command = execution.commandResult.command;\n      reference = command;\n      if (/\\b(test|vitest|jest|pytest|cargo test|go test)\\b/i.test(command)) type = 'test';\n      else if (/\\b(build|compile|tsc)\\b/i.test(command)) type = 'build';\n    } else if (execution.changes?.length) {\n      reference = execution.changes.map((change) => change.path).join(', ');\n    } else if (typeof call.input.path === 'string') reference = call.input.path;\n    else if (typeof call.input.symbol === 'string') reference = call.input.symbol;\n    try {\n      this.executionPlanner.recordEvidence(context.chatId, context.runId, { type, summary: `${call.name} concluído`, ...(reference ? { reference } : {}) });\n    } catch {}\n  }\n\n  private isMutation(name: ToolName): boolean {"
          assert old in tool
          tool = tool.replace(old, new, 1)

          old = "  private async executeAllowed(projectId: string, name: ToolName, input: Record<string, unknown>): Promise<ToolExecution> {\n    switch (name) {\n      case 'read_file':"
          new = "  private async executeAllowed(projectId: string, name: ToolName, input: Record<string, unknown>, context: ActivityContext = {}): Promise<ToolExecution> {\n    switch (name) {\n      case 'plan_execution': {\n        if (!this.executionPlanner) throw new Error('O planner de execução não foi configurado.');\n        if (!context.chatId || !context.runId) throw new Error('Contexto da execução indisponível para o planner.');\n        const objective = this.stringValue(input, 'objective');\n        const steps = input.steps;\n        if (!Array.isArray(steps) || steps.length === 0 || steps.some((step) => typeof step !== 'string' || !step.trim())) throw new Error(\"Parâmetro 'steps' inválido.\");\n        const created = this.executionPlanner.create(context.chatId, context.runId, objective, steps.map((step) => String(step).trim()));\n        const started = this.executionPlanner.startStep(context.chatId, context.runId, created.steps[0].id);\n        return { output: JSON.stringify(started) };\n      }\n      case 'complete_plan_step': {\n        if (!this.executionPlanner) throw new Error('O planner de execução não foi configurado.');\n        if (!context.chatId || !context.runId) throw new Error('Contexto da execução indisponível para o planner.');\n        const current = this.executionPlanner.get(context.chatId, context.runId);\n        if (!current) throw new Error('Plano da execução não encontrado.');\n        const running = current.steps.find((step) => step.status === 'running');\n        if (!running) throw new Error('Nenhum passo do plano está em execução.');\n        if (!running.evidence.length) throw new Error('O passo atual ainda não possui evidência real de execução.');\n        let updated = this.executionPlanner.completeStep(context.chatId, context.runId, running.id);\n        if (updated.status !== 'completed' && updated.status !== 'failed') {\n          const next = updated.steps.find((step) => step.status === 'pending');\n          if (next) updated = this.executionPlanner.startStep(context.chatId, context.runId, next.id);\n        }\n        return { output: JSON.stringify(updated) };\n      }\n      case 'read_file':"
          assert old in tool
          tool = tool.replace(old, new, 1)
          tool_path.write_text(tool, encoding='utf-8')

          chat_path = Path('src/ai/chat-runtime.ts')
          chat = chat_path.read_text(encoding='utf-8')
          old = "- For multi-step requests, continue using tools until every requested step that can be performed with available tools is actually complete. Do not stop after the first successful operation merely to describe the remaining work.\n"
          new = old + "- For substantial multi-step tasks, use plan_execution to declare a concise ordered plan before doing the tool work. Auto CodeZ records real tool evidence against the running step. Use complete_plan_step only after the current step has real evidence, and finish every declared plan step before giving the final answer. Do not create a plan for trivial one-step questions or actions.\n"
          assert old in chat
          chat = chat.replace(old, new, 1)
          old = "const SYSTEM_CHAT_TOOL_NAMES = new Set(['read_file'"
          new = "const SYSTEM_CHAT_TOOL_NAMES = new Set(['plan_execution', 'complete_plan_step', 'read_file'"
          assert old in chat
          chat = chat.replace(old, new, 1)
          chat_path.write_text(chat, encoding='utf-8')

          main_path = Path('src/main.ts')
          main = main_path.read_text(encoding='utf-8')
          old = "const executionPlanner = new ExecutionPlanner();\nconst executionPlanStore"
          new = "const executionPlanner = new ExecutionPlanner();\ntoolRuntime.configureExecutionPlanner(executionPlanner);\nconst executionPlanStore"
          assert old in main
          main = main.replace(old, new, 1)
          main_path.write_text(main, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/execution-planner.ts src/agent/tool-runtime.ts src/ai/chat-runtime.ts src/main.ts
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "ggmacro"
          git config user.email "sebastiao54e@gmail.com"
          git add src/execution-planner.ts src/agent/tool-runtime.ts src/ai/chat-runtime.ts src/main.ts
          git commit -m "feat(execution): connect evidence-backed planner tools"
          git push origin HEAD:feature/ui-hierarchy-polish
