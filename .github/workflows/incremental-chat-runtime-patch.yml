name: Apply incremental chat runtime patch

on:
  push:
    branches:
      - feature/ui-hierarchy-polish
    paths:
      - .github/workflows/incremental-chat-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish
          fetch-depth: 0
      - name: Patch chat runtime
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('src/ai/chat-runtime.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              "- File tools such as read_file, write_file, create_file, delete_file, rename_file, and search_files operate on the active Auto CodeZ workspace and use workspace-relative paths.",
              "- File tools such as read_file, write_file, create_file, replace_range, insert_before, insert_after, delete_file, rename_file, and search_files operate on the active Auto CodeZ workspace and use workspace-relative paths."
            ),
            (
              "- Inside an Auto CodeZ project workspace, use create_file, write_file, delete_file and rename_file for direct file mutations whenever those tools can represent the requested operation. Do not substitute shell redirection, PowerShell file-writing commands or similar run_command filesystem edits for these file tools. This preserves diff review, stale-file protection, approval ownership and recoverability.",
              "- Inside an Auto CodeZ project workspace, use file tools for direct file mutations whenever they can represent the requested operation. For localized edits, prefer replace_range, insert_before or insert_after instead of rewriting the whole file with write_file. Use write_file when most or all of a file genuinely needs replacement. Do not substitute shell redirection, PowerShell file-writing commands or similar run_command filesystem edits for these file tools. This preserves smaller diffs, diff review, stale-file protection, approval ownership and recoverability."
            ),
            (
              "- In a normal chat, prefer create_file/write_file/delete_file/rename_file over run_command for direct file mutations. create_file automatically creates missing parent directories, so creating Desktop/Novo site/index.html also creates the required folder path safely.",
              "- In a normal chat, prefer create_file/write_file/replace_range/insert_before/insert_after/delete_file/rename_file over run_command for direct file mutations. For localized edits, prefer the incremental tools instead of replacing the whole file. create_file automatically creates missing parent directories, so creating Desktop/Novo site/index.html also creates the required folder path safely."
            ),
            (
              "const SYSTEM_CHAT_TOOL_NAMES = new Set(['read_file', 'write_file', 'create_file', 'delete_file', 'rename_file', 'search_files', 'run_command']);",
              "const SYSTEM_CHAT_TOOL_NAMES = new Set(['read_file', 'write_file', 'create_file', 'replace_range', 'insert_before', 'insert_after', 'delete_file', 'rename_file', 'search_files', 'run_command']);"
            ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected snippet not found: {old[:120]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='')
          '@ | Set-Content -Encoding utf8 .patch_chat_runtime.py
          python .patch_chat_runtime.py
          Remove-Item .patch_chat_runtime.py
          git diff --check
          git diff -- src/ai/chat-runtime.ts
      - name: Commit runtime patch
        shell: pwsh
        run: |
          git config user.name "ggmacro"
          git config user.email "sebastiao54e@gmail.com"
          git add src/ai/chat-runtime.ts
          git commit -m "feat(agent): prefer incremental file edits in chat runtime"
          git push origin HEAD:feature/ui-hierarchy-polish
