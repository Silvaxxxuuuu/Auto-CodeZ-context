name: Real Vision Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'feature/**'
      - 'fix/**'
      - main
    paths:
      - '.github/workflows/vision-integration.yml'
      - 'scripts/real-vision-integration.ps1'

permissions:
  contents: read

jobs:
  vision:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run verified local vision integration
        shell: powershell
        run: ./scripts/real-vision-integration.ps1

      - name: Upload vision fixtures and model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-codez-real-vision-${{ github.run_id }}
          path: |
            artifacts/vision-real/fixtures
            artifacts/vision-real/*.txt
            artifacts/vision-real/*.log
          if-no-files-found: warn
          retention-days: 14
