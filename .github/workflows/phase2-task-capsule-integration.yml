name: Integrate immutable task capsules

on:
  push:
    branches:
      - feature/ui-hierarchy-polish
    paths:
      - .github/workflows/phase2-task-capsule-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish
          fetch-depth: 0
      - name: Integrate Task Capsule runtime
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('src/main.ts')
          text = main.read_text(encoding='utf-8')

          def replace_once(old: str, new: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { ExecutionQualityGatePersistence, ExecutionQualityGateStore } from './execution-quality-gate-store';\n",
              "import { ExecutionQualityGatePersistence, ExecutionQualityGateStore } from './execution-quality-gate-store';\nimport { ExecutionTaskCapsuleRuntime } from './execution-task-capsule';\nimport { ExecutionTaskCapsulePersistence, ExecutionTaskCapsuleStore } from './execution-task-capsule-store';\n",
          )
          replace_once(
              "const executionQualityGatePersistence = new ExecutionQualityGatePersistence(executionQualityGateStore);\n",
              "const executionQualityGatePersistence = new ExecutionQualityGatePersistence(executionQualityGateStore);\nconst executionTaskCapsuleRuntime = new ExecutionTaskCapsuleRuntime();\nconst executionTaskCapsuleStore = new ExecutionTaskCapsuleStore(storage);\nconst executionTaskCapsulePersistence = new ExecutionTaskCapsulePersistence(executionTaskCapsuleStore);\n",
          )
          replace_once(
              "let executionQualityGatePersistenceEnabled = false;\n",
              "let executionQualityGatePersistenceEnabled = false;\nlet executionTaskCapsulePersistenceEnabled = false;\n",
          )

          context_function_end = """  const projectContext = chat.projectId ? `${computerContext}\\n\\n${await projectManager.buildContext(chat.projectId)}` : computerContext;\n  return { chat, config, projectContext };\n}\n\n"""
          helper = context_function_end + """function captureExecutionTaskCapsule(\n  chat: Awaited<ReturnType<ChatManager['list']>>[number],\n  runId: string,\n  objective: string,\n): void {\n  executionTaskCapsuleRuntime.create({\n    chatId: chat.id,\n    runId,\n    objective,\n    projectId: chat.projectId,\n    providerId: chat.providerId,\n    model: chat.model,\n    permissionLevel: chat.permissionLevel,\n  });\n  if (executionTaskCapsulePersistenceEnabled) executionTaskCapsulePersistence.schedule(executionTaskCapsuleRuntime.list());\n}\n\n"""
          replace_once(context_function_end, helper)

          replace_once(
              "  if (executionQualityGateRuntime.removeChat(id) && executionQualityGatePersistenceEnabled) executionQualityGatePersistence.schedule(executionQualityGateRuntime.list());\n  return chatManager.remove(id);\n",
              "  if (executionQualityGateRuntime.removeChat(id) && executionQualityGatePersistenceEnabled) executionQualityGatePersistence.schedule(executionQualityGateRuntime.list());\n  if (executionTaskCapsuleRuntime.removeChat(id) && executionTaskCapsulePersistenceEnabled) executionTaskCapsulePersistence.schedule(executionTaskCapsuleRuntime.list());\n  return chatManager.remove(id);\n",
          )
          replace_once(
              "  const runId = execution.runId;\n  try {\n    await chatManager.addMessage(chat.id, { role: 'user', content, createdAt: Date.now() });\n",
              "  const runId = execution.runId;\n  captureExecutionTaskCapsule(chat, runId, content);\n  try {\n    await chatManager.addMessage(chat.id, { role: 'user', content, createdAt: Date.now() });\n",
          )
          stream_anchor = """  const runId = execution.runId;\n  const controller = new AbortController();\n"""
          stream_replacement = """  const runId = execution.runId;\n  captureExecutionTaskCapsule(chat, runId, content);\n  const controller = new AbortController();\n"""
          replace_once(stream_anchor, stream_replacement)

          quality_handlers = """ipcMain.handle('agent:list-execution-quality-gates', async (_event, chatId?: string) => executionQualityGateRuntime.list(chatId === undefined ? undefined : requireIdentifier(chatId, 'Chat')));\n"""
          capsule_handlers = quality_handlers + """ipcMain.handle('agent:get-execution-task-capsule', async (_event, input: unknown) => {\n  const value = requireObject(input, 'Identificação da Task Capsule');\n  return executionTaskCapsuleRuntime.get(requireIdentifier(value.chatId, 'Chat'), requireIdentifier(value.runId, 'Execução')) ?? null;\n});\nipcMain.handle('agent:list-execution-task-capsules', async (_event, chatId?: string) => executionTaskCapsuleRuntime.list(chatId === undefined ? undefined : requireIdentifier(chatId, 'Chat')));\n"""
          replace_once(quality_handlers, capsule_handlers)

          replace_once(
              "  executionQualityGateRuntime.restore(await executionQualityGateStore.load());\n  await restorePersistedExecutionSnapshots();\n",
              "  executionQualityGateRuntime.restore(await executionQualityGateStore.load());\n  executionTaskCapsuleRuntime.restore(await executionTaskCapsuleStore.load());\n  await restorePersistedExecutionSnapshots();\n",
          )
          replace_once(
              "  executionQualityGatePersistenceEnabled = true;\n  executionStatePersistence.schedule(executionManager.list());\n",
              "  executionQualityGatePersistenceEnabled = true;\n  executionTaskCapsulePersistenceEnabled = true;\n  executionStatePersistence.schedule(executionManager.list());\n",
          )
          replace_once(
              "  executionQualityGatePersistence.schedule(executionQualityGateRuntime.list());\n",
              "  executionQualityGatePersistence.schedule(executionQualityGateRuntime.list());\n  executionTaskCapsulePersistence.schedule(executionTaskCapsuleRuntime.list());\n",
          )
          main.write_text(text, encoding='utf-8')

          preload = Path('src/preload.ts')
          ptext = preload.read_text(encoding='utf-8')
          old = "  listExecutionQualityGates: (chatId?: string) => invoke('agent:list-execution-quality-gates', chatId === undefined ? undefined : requireIdentifier(chatId, 'Chat')),\n"
          new = old + "  getExecutionTaskCapsule: (input: { chatId: string; runId: string }) => { const value = requireObject(input, 'Identificação da Task Capsule'); return invoke('agent:get-execution-task-capsule', { chatId: requireIdentifier(value.chatId, 'Chat'), runId: requireIdentifier(value.runId, 'Execução') }); },\n  listExecutionTaskCapsules: (chatId?: string) => invoke('agent:list-execution-task-capsules', chatId === undefined ? undefined : requireIdentifier(chatId, 'Chat')),\n"
          if ptext.count(old) != 1:
              raise SystemExit('Preload quality gate anchor mismatch')
          preload.write_text(ptext.replace(old, new, 1), encoding='utf-8')

          storage = Path('src/core/storage.ts')
          stext = storage.read_text(encoding='utf-8')
          old = "  'execution-quality-gates.json',\n  'execution-timeline.json',\n"
          new = "  'execution-quality-gates.json',\n  'execution-task-capsules.json',\n  'execution-timeline.json',\n"
          if stext.count(old) != 1:
              raise SystemExit('Storage sensitive file anchor mismatch')
          storage.write_text(stext.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git diff -- src/main.ts src/preload.ts src/core/storage.ts
      - name: Commit integration and remove temporary workflow
        shell: bash
        run: |
          git config user.name "ggmacro"
          git config user.email "sebastiao54e@gmail.com"
          git rm .github/workflows/phase2-task-capsule-integration.yml
          git add src/main.ts src/preload.ts src/core/storage.ts
          git commit -m "feat(execution): integrate immutable task capsules"
          git push origin HEAD:feature/ui-hierarchy-polish
