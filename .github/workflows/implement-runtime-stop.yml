name: Apply surgical runtime stop fix

on:
  push:
    branches: [feature/ui-hierarchy-polish]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply surgical changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text()
              out = fn(s)
              if out == s:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(out)

          # Provider-neutral abort contract.
          edit('src/ai/types.ts', lambda s: s.replace("type: 'start' | 'delta' | 'activity' | 'tool_call' | 'usage' | 'complete' | 'approval_required' | 'error'", "type: 'start' | 'delta' | 'activity' | 'tool_call' | 'usage' | 'complete' | 'approval_required' | 'cancelled' | 'error'")
               .replace('tools?: AIToolDefinition[]; }', 'tools?: AIToolDefinition[]; signal?: AbortSignal; }')
               .replace('send(config: AIProviderConfig, request: AIRequest): Promise<AIResponse>; stream?(config: AIProviderConfig, request: AIRequest): AsyncIterable<AIStreamEvent>', 'send(config: AIProviderConfig, request: AIRequest, signal?: AbortSignal): Promise<AIResponse>; stream?(config: AIProviderConfig, request: AIRequest, signal?: AbortSignal): AsyncIterable<AIStreamEvent>'))

          edit('src/ai/sse.ts', lambda s: re.sub(
              r"const controller = new AbortController\(\);\n  const timer = setTimeout\(\(\) => controller\.abort\(\), timeoutMs\);\n  const signal = init\.signal;\n  const onAbort = \(\): void => controller\.abort\(\);",
              "const controller = new AbortController();\n  let timedOut = false;\n  const timer = setTimeout(() => { timedOut = true; controller.abort(); }, timeoutMs);\n  const signal = init.signal;\n  const onAbort = (): void => controller.abort();",
              s).replace("if (controller.signal.aborted) throw new Error(`A requisição ao provider excedeu o tempo limite de ${Math.round(timeoutMs / 1000)} segundos.`);\n    throw error;", "if (timedOut) throw new Error(`A requisição ao provider excedeu o tempo limite de ${Math.round(timeoutMs / 1000)} segundos.`);\n    if (signal?.aborted) throw new DOMException('A operação foi cancelada.', 'AbortError');\n    throw error;") )

          for path in ['src/ai/providers/openai.ts','src/ai/providers/google.ts','src/ai/providers/anthropic.ts']:
              def adapter(s):
                  s = s.replace('async send(config: AIProviderConfig, request: AIRequest): Promise<AIResponse>', 'async send(config: AIProviderConfig, request: AIRequest, signal?: AbortSignal): Promise<AIResponse>')
                  s = s.replace('async *stream(config: AIProviderConfig, request: AIRequest): AsyncGenerator<AIStreamEvent>', 'async *stream(config: AIProviderConfig, request: AIRequest, signal?: AbortSignal): AsyncGenerator<AIStreamEvent>')
                  s = re.sub(r'(fetchWithTimeout\([^\n]+?\},\s*REQUEST_TIMEOUT_MS)(\);)', r'\1, signal\2', s)
                  s = re.sub(r'(fetchWithTimeout\([^\n]+?\},\s*MODEL_LIST_TIMEOUT_MS)(\);)', r'\1\2', s)
                  return s
              edit(path, adapter)

          def chat_runtime(s):
              s = s.replace('async send(config: AIProviderConfig, chat: ChatRecord, projectContext?: string): Promise<AIResponse>', 'async send(config: AIProviderConfig, chat: ChatRecord, projectContext?: string, signal?: AbortSignal): Promise<AIResponse>')
              s = s.replace('async *stream(config: AIProviderConfig, chat: ChatRecord, projectContext?: string): AsyncGenerator<AIStreamEvent>', 'async *stream(config: AIProviderConfig, chat: ChatRecord, projectContext?: string, signal?: AbortSignal): AsyncGenerator<AIStreamEvent>')
              s = s.replace('adapter.send(config, request)', 'adapter.send(config, request, signal)')
              s = s.replace('adapter.stream(config, request)', 'adapter.stream(config, request, signal)')
              s = s.replace("const AUTOCODEZ_SYSTEM_INSTRUCTIONS = `", "function isAbortError(error: unknown): boolean { return error instanceof DOMException && error.name === 'AbortError'; }\n\nconst AUTOCODEZ_SYSTEM_INSTRUCTIONS = `")
              s = s.replace("} catch (error) {\n        const normalized = normalizeProviderError(adapter.displayName, 'request', error);", "} catch (error) {\n        if (isAbortError(error)) throw error;\n        const normalized = normalizeProviderError(adapter.displayName, 'request', error);")
              s = s.replace("} catch (error) {\n        if (!completed) {\n          const normalized = normalizeProviderError(adapter.displayName, 'stream', error);", "} catch (error) {\n        if (isAbortError(error)) throw error;\n        if (!completed) {\n          const normalized = normalizeProviderError(adapter.displayName, 'stream', error);")
              s = s.replace("} catch (error) {\n      const normalized = normalizeProviderError(config.displayName, 'stream', error);\n      const message = formatProviderError(normalized);", "} catch (error) {\n      if (isAbortError(error)) throw error;\n      const normalized = normalizeProviderError(config.displayName, 'stream', error);\n      const message = formatProviderError(normalized);")
              return s
          edit('src/ai/chat-runtime.ts', chat_runtime)

          def agent_runtime(s):
              s = s.replace('async runStreaming(config: AIProviderConfig, chat: ChatRecord, projectContext: string | undefined, permission: PermissionLevel, emit: StreamEmitter): Promise<AgentRunResult>', 'async runStreaming(config: AIProviderConfig, chat: ChatRecord, projectContext: string | undefined, permission: PermissionLevel, emit: StreamEmitter, signal?: AbortSignal): Promise<AgentRunResult>')
              s = s.replace('return this.runStreamLoop(run); }\n  async resumeRecovered', 'return this.runStreamLoop(run, signal); }\n  async resumeRecovered')
              s = s.replace('private async runStreamLoop(run: PendingRun): Promise<AgentRunResult>', 'private async runStreamLoop(run: PendingRun, signal?: AbortSignal): Promise<AgentRunResult>')
              s = s.replace('for await (const event of this.chatRuntime.stream(run.config, run.workingChat, run.projectContext))', 'for await (const event of this.chatRuntime.stream(run.config, run.workingChat, run.projectContext, signal))')
              s = s.replace('  private getPending(approvalId: string): PendingRun {', "  async cancel(runId: string): Promise<void> {\n    this.recoverableRuns.delete(runId);\n    for (const [approvalId, run] of this.pendingRuns) if (run.runId === runId) this.pendingRuns.delete(approvalId);\n    await this.persist();\n  }\n  private getPending(approvalId: string): PendingRun {")
              old = "if (pendingApprovalIds.length) { run.pendingApprovalIds = pendingApprovalIds; run.approvalCalls = approvalCalls; this.recoverableRuns.delete(run.runId); for (const approvalId of pendingApprovalIds) this.pendingRuns.set(approvalId, run); this.activity.emit({ runId: run.runId, chatId: run.chat.id, type: 'action', message: 'O agente aguarda aprovação antes de continuar.', status: 'pending' }); await this.persist();"
              new = "if (pendingApprovalIds.length) { run.pendingApprovalIds = pendingApprovalIds; run.approvalCalls = approvalCalls; this.recoverableRuns.delete(run.runId); for (const approvalId of pendingApprovalIds) this.pendingRuns.set(approvalId, run); emit({ type: 'approval_required', chatId: run.chat.id, runId: run.runId, pendingApprovalIds: [...pendingApprovalIds] }); this.activity.emit({ runId: run.runId, chatId: run.chat.id, type: 'action', message: 'O agente aguarda aprovação antes de continuar.', status: 'pending' }); await this.persist();"
              if old not in s: raise SystemExit('Agent approval block not found')
              s = s.replace(old, new)
              return s
          edit('src/agent/agent-runtime.ts', agent_runtime)

          def preload(s):
              needle = "  streamChat: async (input: { chatId: string; content: string }) => {"
              insert = "  stopChat: (chatId: string) => invoke('chat:stop', requireIdentifier(chatId, 'Chat')),\n"
              if insert.strip() not in s: s = s.replace(needle, insert + needle)
              return s
          edit('src/preload.ts', preload)

          def main(s):
              s = s.replace("const executionManager = new ExecutionManager();", "const executionManager = new ExecutionManager();\nconst activeStreamControllers = new Map<string, { runId: string; controller: AbortController }>();")
              s = s.replace("    const result = await agentRuntime.runStreaming(config, workingChat, projectContext, workingChat.permissionLevel, emit);", "    const controller = new AbortController();\n    activeStreamControllers.set(chatId, { runId: execution.runId, controller });\n    const result = await agentRuntime.runStreaming(config, workingChat, projectContext, workingChat.permissionLevel, emit, controller.signal);")
              s = s.replace("  } catch (error) {\n    const message = error instanceof Error ? error.message : String(error);\n    executionManager.update(chatId, { state: 'failed', error: message, runId: execution.runId });\n    emit({ type: 'error', error: message });\n    return { pendingApprovalIds: [], chat: (await chatManager.list()).find((item) => item.id === chat.id), error: message };\n  }\n});", "  } catch (error) {\n    const active = activeStreamControllers.get(chatId);\n    if (active?.runId === execution.runId && active.controller.signal.aborted) {\n      await agentRuntime.cancel(execution.runId);\n      executionManager.update(chatId, { state: 'completed', runId: execution.runId });\n      emit({ type: 'cancelled' });\n      return { pendingApprovalIds: [], chat: (await chatManager.list()).find((item) => item.id === chat.id), error: undefined };\n    }\n    const message = error instanceof Error ? error.message : String(error);\n    executionManager.update(chatId, { state: 'failed', error: message, runId: execution.runId });\n    emit({ type: 'error', error: message });\n    return { pendingApprovalIds: [], chat: (await chatManager.list()).find((item) => item.id === chat.id), error: message };\n  } finally {\n    const active = activeStreamControllers.get(chatId);\n    if (active?.runId === execution.runId) activeStreamControllers.delete(chatId);\n  }\n});\n\nipcMain.handle('chat:stop', async (_event, chatId: string) => {\n  const id = requireIdentifier(chatId, 'Chat');\n  const active = activeStreamControllers.get(id);\n  if (!active) return { stopped: false };\n  active.controller.abort();\n  if (mainWindow && !mainWindow.isDestroyed()) mainWindow.webContents.send('chat:stream-event', { type: 'cancelled', chatId: id, runId: active.runId });\n  return { stopped: true };\n});")
              return s
          edit('src/main.ts', main)

          def renderer(s):
              s = s.replace("import './index.css';", "import './index.css';\nimport './stop-button.css';")
              s = s.replace("type StreamEvent = { type: 'start' | 'delta' | 'activity' | 'tool_call' | 'usage' | 'complete' | 'approval_required' | 'error';", "type StreamEvent = { type: 'start' | 'delta' | 'activity' | 'tool_call' | 'usage' | 'complete' | 'approval_required' | 'cancelled' | 'error';")
              s = s.replace("      streamChat: (input: { chatId: string; content: string }) => Promise<{ pendingApprovalIds: string[]; chat: Chat }>;
", "      streamChat: (input: { chatId: string; content: string }) => Promise<{ pendingApprovalIds: string[]; chat: Chat }>;
      stopChat: (chatId: string) => Promise<{ stopped: boolean }>;
")
              old = "  sendButton.disabled = !activeChat || !prompt.value.trim() || busy || pendingApprovals.length > 0;\n  prompt.disabled = busy;"
              new = "  const stopping = executionState === 'running';\n  sendButton.disabled = !activeChat || (!stopping && (!prompt.value.trim() || pendingApprovals.length > 0));\n  sendButton.classList.toggle('is-stop', stopping);\n  sendButton.title = stopping ? 'Parar' : 'Enviar';\n  sendButton.setAttribute('aria-label', stopping ? 'Parar' : 'Enviar');\n  prompt.disabled = busy;"
              if old not in s: raise SystemExit('renderer composer block not found')
              s = s.replace(old, new)
              s = s.replace("async function sendMessage(contentOverride?: string, isRetry = false): Promise<void> {", "async function stopMessage(): Promise<void> {\n  if (!activeChat || executionState !== 'running') return;\n  const chatId = activeChat.id;\n  try { await window.autoCodez.stopChat(chatId); } catch { /* renderer is reset locally even if IPC is already closing */ }\n  if (activeChat?.id !== chatId) return;\n  executionState = 'idle';\n  streamingText = '';\n  streamingActivity = [];\n  pendingApprovals = [];\n  lastError = '';\n  retryContent = '';\n  lastSubmittedContent = '';\n  renderMessages();\n  renderComposer();\n}\n\nasync function sendMessage(contentOverride?: string, isRetry = false): Promise<void> {")
              s = s.replace("sendButton.addEventListener('click', () => void sendMessage());", "sendButton.addEventListener('click', () => void (executionState === 'running' ? stopMessage() : sendMessage()));")
              s = s.replace("  if (event.type === 'complete') {", "  if (event.type === 'cancelled') {\n    if (activeChat && event.chatId === activeChat.id) {\n      executionState = 'idle';\n      streamingText = '';\n      streamingActivity = [];\n      pendingApprovals = [];\n      lastError = '';\n      retryContent = '';\n      lastSubmittedContent = '';\n      renderMessages();\n      renderComposer();\n    }\n    return;\n  }\n  if (event.type === 'complete') {")
              return s
          edit('src/renderer.ts', renderer)

          Path('src/stop-button.css').write_text(".send-button.is-stop{position:relative;font-size:0;}\n.send-button.is-stop::before{content:\"\";width:10px;height:10px;border-radius:2px;background:currentColor;display:block;}\n.send-button.is-stop:disabled{opacity:1;cursor:pointer;}\n")
          PY
      - name: Validate
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --runInBand
          npm run lint
          npm run make
      - name: Commit surgical fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-runtime-stop.yml
          git add src/ai/types.ts src/ai/sse.ts src/ai/chat-runtime.ts src/ai/providers/openai.ts src/ai/providers/google.ts src/ai/providers/anthropic.ts src/agent/agent-runtime.ts src/main.ts src/preload.ts src/renderer.ts src/stop-button.css
          git commit -m "fix(runtime): add provider-neutral stop and approval events"
          git push origin HEAD:feature/ui-hierarchy-polish
