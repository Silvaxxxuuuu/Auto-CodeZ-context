name: Integrate execution quality gates

on:
  push:
    branches:
      - feature/ui-hierarchy-polish
    paths:
      - .github/workflows/phase2-quality-gate-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-hierarchy-polish
          fetch-depth: 0
      - name: Integrate quality gate runtime
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('src/main.ts')
          text = main.read_text(encoding='utf-8')

          def replace_once(old: str, new: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { ExecutionReportBuilder } from './execution-report';\n",
              "import { ExecutionReportBuilder } from './execution-report';\nimport { ExecutionQualityGateRuntime, type ExecutionQualityGateRequirement } from './execution-quality-gate';\nimport { ExecutionQualityGatePersistence, ExecutionQualityGateStore } from './execution-quality-gate-store';\n",
          )
          replace_once(
              "const executionReportBuilder = new ExecutionReportBuilder(executionManager, executionTimeline, executionPlanHistory);\n",
              "const executionReportBuilder = new ExecutionReportBuilder(executionManager, executionTimeline, executionPlanHistory);\nconst executionQualityGateRuntime = new ExecutionQualityGateRuntime();\nconst executionQualityGateStore = new ExecutionQualityGateStore(storage);\nconst executionQualityGatePersistence = new ExecutionQualityGatePersistence(executionQualityGateStore);\n",
          )
          replace_once(
              "let executionPlanHistoryPersistenceEnabled = false;\n",
              "let executionPlanHistoryPersistenceEnabled = false;\nlet executionQualityGatePersistenceEnabled = false;\n",
          )
          replace_once(
              "  if (executionPlanHistory.purgeChat(id) && executionPlanHistoryPersistenceEnabled) executionPlanHistoryPersistence.schedule(executionPlanHistory.list());\n  return chatManager.remove(id);\n",
              "  if (executionPlanHistory.purgeChat(id) && executionPlanHistoryPersistenceEnabled) executionPlanHistoryPersistence.schedule(executionPlanHistory.list());\n  if (executionQualityGateRuntime.removeChat(id) && executionQualityGatePersistenceEnabled) executionQualityGatePersistence.schedule(executionQualityGateRuntime.list());\n  return chatManager.remove(id);\n",
          )

          report_handlers = """ipcMain.handle('agent:get-execution-report', async (_event, input: unknown) => {\n  const value = requireObject(input, 'Identificação do relatório de execução');\n  const chatId = requireIdentifier(value.chatId, 'Chat');\n  const runId = requireIdentifier(value.runId, 'Execução');\n  return executionReportBuilder.build(chatId, runId) ?? null;\n});\nipcMain.handle('agent:list-execution-reports', async (_event, chatId?: string) => executionReportBuilder.list(chatId === undefined ? undefined : requireIdentifier(chatId, 'Chat')));\n"""
          quality_handlers = report_handlers + """ipcMain.handle('agent:configure-execution-quality-gate', async (_event, input: unknown) => {\n  const value = requireObject(input, 'Configuração do quality gate');\n  const chatId = requireIdentifier(value.chatId, 'Chat');\n  const runId = requireIdentifier(value.runId, 'Execução');\n  if (value.requireVerifiedCompletion !== undefined && typeof value.requireVerifiedCompletion !== 'boolean') throw new Error('requireVerifiedCompletion inválido.');\n  if (value.requirements !== undefined && !Array.isArray(value.requirements)) throw new Error('Requisitos do quality gate inválidos.');\n  const requirements = (value.requirements ?? []) as ExecutionQualityGateRequirement[];\n  const gate = executionQualityGateRuntime.configure({ chatId, runId, requireVerifiedCompletion: value.requireVerifiedCompletion as boolean | undefined, requirements });\n  if (executionQualityGatePersistenceEnabled) executionQualityGatePersistence.schedule(executionQualityGateRuntime.list());\n  return gate;\n});\nipcMain.handle('agent:get-execution-quality-gate', async (_event, input: unknown) => {\n  const value = requireObject(input, 'Identificação do quality gate');\n  return executionQualityGateRuntime.get(requireIdentifier(value.chatId, 'Chat'), requireIdentifier(value.runId, 'Execução')) ?? null;\n});\nipcMain.handle('agent:evaluate-execution-quality-gate', async (_event, input: unknown) => {\n  const value = requireObject(input, 'Identificação do quality gate');\n  const chatId = requireIdentifier(value.chatId, 'Chat');\n  const runId = requireIdentifier(value.runId, 'Execução');\n  return executionQualityGateRuntime.evaluate(executionReportBuilder.build(chatId, runId)) ?? null;\n});\nipcMain.handle('agent:list-execution-quality-gates', async (_event, chatId?: string) => executionQualityGateRuntime.list(chatId === undefined ? undefined : requireIdentifier(chatId, 'Chat')));\n"""
          replace_once(report_handlers, quality_handlers)

          replace_once(
              "  executionPlanHistory.restore(await executionPlanHistoryStore.load());\n  await restorePersistedExecutionSnapshots();\n",
              "  executionPlanHistory.restore(await executionPlanHistoryStore.load());\n  executionQualityGateRuntime.restore(await executionQualityGateStore.load());\n  await restorePersistedExecutionSnapshots();\n",
          )
          replace_once(
              "  executionPlanHistoryPersistenceEnabled = true;\n  executionStatePersistence.schedule(executionManager.list());\n",
              "  executionPlanHistoryPersistenceEnabled = true;\n  executionQualityGatePersistenceEnabled = true;\n  executionStatePersistence.schedule(executionManager.list());\n",
          )
          replace_once(
              "  executionPlanHistoryPersistence.schedule(executionPlanHistory.list());\n",
              "  executionPlanHistoryPersistence.schedule(executionPlanHistory.list());\n  executionQualityGatePersistence.schedule(executionQualityGateRuntime.list());\n",
          )
          main.write_text(text, encoding='utf-8')

          preload = Path('src/preload.ts')
          ptext = preload.read_text(encoding='utf-8')
          old = "  listExecutionReports: (chatId?: string) => invoke('agent:list-execution-reports', chatId === undefined ? undefined : requireIdentifier(chatId, 'Chat')),\n"
          new = old + "  configureExecutionQualityGate: (input: unknown) => invoke('agent:configure-execution-quality-gate', input),\n  getExecutionQualityGate: (input: { chatId: string; runId: string }) => { const value = requireObject(input, 'Identificação do quality gate'); return invoke('agent:get-execution-quality-gate', { chatId: requireIdentifier(value.chatId, 'Chat'), runId: requireIdentifier(value.runId, 'Execução') }); },\n  evaluateExecutionQualityGate: (input: { chatId: string; runId: string }) => { const value = requireObject(input, 'Identificação do quality gate'); return invoke('agent:evaluate-execution-quality-gate', { chatId: requireIdentifier(value.chatId, 'Chat'), runId: requireIdentifier(value.runId, 'Execução') }); },\n  listExecutionQualityGates: (chatId?: string) => invoke('agent:list-execution-quality-gates', chatId === undefined ? undefined : requireIdentifier(chatId, 'Chat')),\n"
          if ptext.count(old) != 1:
              raise SystemExit('Preload report anchor mismatch')
          preload.write_text(ptext.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git diff -- src/main.ts src/preload.ts
      - name: Commit integration and remove temporary workflow
        shell: bash
        run: |
          git config user.name "ggmacro"
          git config user.email "sebastiao54e@gmail.com"
          git rm .github/workflows/phase2-quality-gate-integration.yml
          git add src/main.ts src/preload.ts
          git commit -m "feat(execution): integrate objective quality gates"
          git push origin HEAD:feature/ui-hierarchy-polish
