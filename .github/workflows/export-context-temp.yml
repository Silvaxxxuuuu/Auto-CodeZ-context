name: Export Context Temporary

on:
  push:
    branches:
      - tmp/context-export-20260925

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload context
        uses: actions/upload-artifact@v4
        with:
          name: auto-codez-context
          path: AUTO_CODEZ_CONTEXT.txt
          if-no-files-found: error
          retention-days: 1
